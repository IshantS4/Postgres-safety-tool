services:
  target-db:
    image: postgres:15
    container_name: target_db_container
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: target_db
    ports:
      - "5434:5432"

  control-db:
    image: postgres:15
    container_name: control_db_container
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: control_db
    ports:
      - "5433:5432"